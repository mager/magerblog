<svg xmlns="http://www.w3.org/2000/svg" width="560" height="344" viewBox="0 0 560 344" role="img" aria-labelledby="title desc">
  <title id="title">Agreements, permission, and signed evidence</title>
  <desc id="desc">The sender and recipient sign terms. The application checks permission before running a tool. JLINC records signed evidence of the exchange. These are separate responsibilities.</desc>
  <rect width="560" height="344" rx="8" fill="#f8f7f3"/>
  <g fill="#fff" stroke="#bec9cd" stroke-width="1.5">
    <rect x="24" y="20" width="512" height="84" rx="6"/>
    <rect x="24" y="130" width="512" height="84" rx="6"/>
    <rect x="24" y="240" width="512" height="84" rx="6"/>
  </g>
  <g stroke="#557383" stroke-width="2" fill="none">
    <path d="M280 105v21m-5-6 5 6 5-6"/>
    <path d="M280 215v21m-5-6 5 6 5-6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#e9f0f4">
      <circle cx="60" cy="62" r="20"/><circle cx="60" cy="172" r="20"/><circle cx="60" cy="282" r="20"/>
    </g>
    <g font-size="20" font-weight="bold" fill="#295a70" text-anchor="middle">
      <text x="60" y="69">1</text><text x="60" y="179">2</text><text x="60" y="289">3</text>
    </g>
    <g font-size="24" font-weight="bold" fill="#19262c">
      <text x="98" y="56">Agree on terms</text>
      <text x="98" y="166">Check permission</text>
      <text x="98" y="276">Record the exchange</text>
    </g>
    <g font-size="18" fill="#425761">
      <text x="98" y="83">Sender and recipient sign the terms.</text>
      <text x="98" y="193">The app checks access before tool use.</text>
      <text x="98" y="303">JLINC supplies signed audit evidence.</text>
    </g>
  </g>
</svg>

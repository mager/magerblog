<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 690" role="img" aria-labelledby="title desc">
  <title id="title">Check a memory change before saving it</title>
  <desc id="desc">A proposed memory change must cite a source and pass an evidence check. Supported changes go to review, then accepted notes are saved with a version and source. Unsupported or conflicting claims stay unresolved and out of accepted memory.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#21628a" stroke-width="1.5"/></marker></defs>
  <rect width="520" height="690" rx="8" fill="#f7f5ef"/>
  <g font-family="Arial, sans-serif" fill="#202a30">
    <text x="28" y="43" font-size="15" letter-spacing="2" fill="#52616a">BEFORE MEMORY CHANGES</text>
    <text x="28" y="82" font-size="27" font-weight="700">A proposal needs evidence</text>
    <rect x="100" y="115" width="320" height="85" rx="5" fill="#fff" stroke="#c9cec9"/>
    <text x="260" y="150" text-anchor="middle" font-size="23" font-weight="700">Proposed change</text>
    <text x="260" y="180" text-anchor="middle" font-size="20" fill="#52616a">Claim + scope + source</text>
    <path d="M260 200v40" stroke="#21628a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="250" width="320" height="85" rx="5" fill="#e1edf4" stroke="#21628a"/>
    <text x="260" y="285" text-anchor="middle" font-size="23" font-weight="700">Check the evidence</text>
    <text x="260" y="315" text-anchor="middle" font-size="20" fill="#34566b">Does it support the claim?</text>
    <path d="M260 335v30H140v9m120-9h120v9" fill="none" stroke="#21628a" stroke-width="2"/>
    <path d="M140 405v10" fill="none" stroke="#21628a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M380 405v10" fill="none" stroke="#21628a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="140" y="399" text-anchor="middle" font-size="18" fill="#34566b">Supported</text>
    <text x="380" y="399" text-anchor="middle" font-size="18" fill="#34566b">Unclear or conflicting</text>
    <rect x="28" y="425" width="224" height="85" rx="5" fill="#fff" stroke="#c9cec9"/>
    <text x="140" y="460" text-anchor="middle" font-size="23" font-weight="700">Review the diff</text>
    <text x="140" y="490" text-anchor="middle" font-size="20" fill="#52616a">Accept useful edits.</text>
    <rect x="272" y="425" width="220" height="112" rx="5" fill="#f3e8d9" stroke="#a37640"/>
    <text x="382" y="460" text-anchor="middle" font-size="23" font-weight="700">Keep unresolved</text>
    <text x="382" y="490" text-anchor="middle" font-size="20" fill="#6b5438">Do not add it to</text>
    <text x="382" y="517" text-anchor="middle" font-size="20" fill="#6b5438">accepted memory.</text>
    <path d="M140 510v55" stroke="#21628a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="154" y="546" font-size="18" fill="#34566b">Accepted</text>
    <rect x="28" y="575" width="464" height="85" rx="5" fill="#e7eddf" stroke="#668151"/>
    <text x="52" y="610" font-size="23" font-weight="700">Save a new version</text>
    <text x="52" y="640" font-size="20" fill="#4e613f">Keep the source and a way to undo.</text>
  </g>
</svg>
